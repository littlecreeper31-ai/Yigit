<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #fff; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; text-align: center; }
    
    /* Google Ekranı */
    #google-view { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; cursor: pointer; }
    .google-logo { font-size: 4rem; font-weight: bold; font-family: 'Product Sans', Arial, sans-serif; margin-bottom: 20px; }
    .g-blue { color: #4285F4; } .g-red { color: #EA4335; } .g-yellow { color: #FBBC05; } .g-green { color: #34A853; }
    .search-box { width: 85%; max-width: 580px; padding: 12px 20px; border: 1px solid #dfe1e5; border-radius: 24px; font-size: 16px; box-shadow: 0 1px 6px rgba(32,33,36,0.28); margin-bottom: 20px; display: flex; align-items: center; color: #5f6368; }
    
    /* Şaka Ekranı */
    #prank-view { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 100vh; background: #0f172a; color: white; padding: 20px; }
    .prank-title { font-size: 3rem; color: #ef4444; font-weight: 900; margin-bottom: 10px; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
    .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 25px; }
    
    /* Skor Kartları */
    .card-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; max-width: 600px; width: 100%; }
    .card { background: #1e293b; border-radius: 12px; padding: 15px; width: 100%; max-width: 270px; border: 2px solid #3b82f6; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .card-title { font-size: 1.1rem; color: #fbbf24; font-weight: bold; margin-bottom: 10px; }
    .score-box { background: #090d16; padding: 10px; border-radius: 8px; margin-top: 5px; }
    .winner { color: #22c55e; font-weight: bold; }
    .loser { color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

  <!-- GOOGLE TAKLİDİ -->
  <div id="google-view" onclick="startPrank()">
    <div class="google-logo">
      <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </div>
    <div class="search-box">🔍 Google'da Ara veya URL yazın...</div>
    <p style="color: #70757a; font-size: 14px;">Aramak için ekrana dokunun</p>
  </div>

  # ŞAKA EKRANI
  <div id="prank-view">
    <h1 class="prank-title">KAZIKLANDINIZ! 😜</h1>
    <p class="subtitle">Yiğit'e Geçmiş Olsun! 💀</p>
    
    <div class="card-container">
      <div class="card">
        <div class="card-title">1. MAÇ (Bea)</div>
        <div class="score-box">
          <p class="winner">ysfebati: 9 Leş / 0 Ölüm</p>
          <p class="loser">LTR | YİĞİT: 0 Leş / 9 Ölüm</p>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">2. MAÇ (Colt)</div>
        <div class="score-box">
          <p class="winner">ysfebati: 7 Leş / 1 Ölüm</p>
          <p class="loser">LTR | YİĞİT: 1 Leş / 7 Ölüm</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function startPrank() {
      document.getElementById('google-view').style.display = 'none';
      document.getElementById('prank-view').style.display = 'flex';
    }
  </script>
</body>
</html>
